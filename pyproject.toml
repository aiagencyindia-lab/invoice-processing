[project]
name = "invoice-processing"
version = "1.0.0"
description = "Invoice Processing -- Unified inference and learning agent for invoice processing"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ['agent-catalog', 'adk', 'agent']
readme = "README.md"

authors = [
    { name = "Pouya Ghiasnezhad Omran", email = "pgomran@google.com" },
    { name = "Tanya Dixit", email = "dixittanya@google.com" },
]

dependencies = [
    "google-adk>=2.13,<3",
    "google-genai>=2.0,<3",
    "sentry-sdk>=2.72,<3",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "google-cloud-storage>=2.14.0",
    "pydantic>=2.8.0",
    "pdfplumber>=0.10.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.141",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.18",
    "google-cloud-pubsub>=2.20.0",
    # Reaches Cloud SQL over an IAM-authenticated tunnel, so the application
    # needs no database password and the instance needs no public IP.
    "cloud-sql-python-connector[pg8000]>=1.7.0",
    "requests>=2.31.0",
    # Writing a correct .xlsx is not "a few lines": shared strings, escaping,
    # and the difference between a number and text that looks like one. It
    # also reads the file back, so an export can be tested rather than eyeballed.
    "openpyxl>=3.1.0",
]

[project.urls]
Repository = "https://github.com/GoogleCloudPlatform/adk-samples"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "agent-starter-pack>=0.14.1",
    "pytest>=8.0.0",
]

[tool.agent_packs]
template = "adk"

[tool.agent-starter-pack]
example_question = "Process the invoice for case_001."

[tool.agent-starter-pack.settings]
agent_directory = "invoice_processing"

[tool.uv]
# google-adk (2.13.0 latest) caps opentelemetry at <=1.44, below the 1.45.1
# fix for GHSA-xcq7-p3pf-p88h. OpenTelemetry's API is stable across 1.x and
# ADK only uses its tracing API (the suite and benchmark pass on 1.45.1).
# Drop this once google-adk allows >=1.45.1.
override-dependencies = [
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
]

[[tool.uv.index]]
name = "default"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
# Inlined from the adk-samples root pyproject. This agent now lives outside
# that repo, so the previous `extend = "../../../pyproject.toml"` resolved to a
# path that does not exist and broke every ruff invocation.
line-length = 80
# Below requires-python on purpose: py311 rewrites every timezone.utc to
# UTC (128 files), a diff for its own change, not a dependency bump.
target-version = "py311"
# The dataset generator is vendored evidence of how the benchmark corpus was
# produced. It is never imported and never edited, so formatting it would only
# make it harder to compare against the original drop.
# Markdown too: ruff 0.17 formats Python blocks inside .md files, and the
# specs and plans under docs/ are a dated record, not code to restyle.
extend-exclude = ["benchmark/dataset/generator", "*.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "PL", # pylint
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "RUF",
    "S",    # flake8-bandit: security anti-patterns
]
ignore = [
    "E501",    # Long LLM prompts and log messages need long strings
    "PLR0913", # Agents and tools legitimately have many parameters
    "PLR2004", # HTTP status codes are universally understood
    "PLR0917", # too-many-positional-arguments
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "C901",    # complex-structure
    "PLW0603", # Module-level singletons and caches
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# The acceptance sweeps import each subsystem inside the check that uses it, so
# one broken import fails a single check instead of preventing the whole sweep
# from running -- which is exactly when you most want the other results.
"scripts/verify_phase*.py" = ["PLC0415"]
# The benchmark stack fixes its environment before importing the product,
# because paths and store resolvers bind at import time; the score module
# imports the product lazily so scoring a saved run needs no dependencies.
"benchmark/harness/*.py" = ["PLC0415"]
# Tests, the benchmark harness and maintenance scripts: assert is the test
# idiom, fixture credentials are fake, subprocess calls run our own tools,
# and SQL is built from fixture literals. Product code gets no such pass.
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S603", "S607", "S608"]
"benchmark/**" = ["S101", "S603", "S607", "S608"]
"scripts/**" = ["S101", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = ["slow: long-running; CI still runs it"]
