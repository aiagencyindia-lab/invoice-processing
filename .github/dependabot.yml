# Weekly upgrade proposals. Security-fix PRs outside this schedule need
# "Dependabot security updates" enabled in the repository settings; the
# audit gate in CI blocks a known-vulnerable dependency either way.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The app runs Node 22 (CI setup-node, frontend/Dockerfile), so its
      # types stay on 22; move this with the Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) supports TypeScript <6.1
      # only (checked 2026-10-14, 8.71.2). Lift once it supports 7.
      - dependency-name: typescript
        versions: [">=7"]
      # eslint-plugin-react (via eslint-config-next) crashes under eslint 10
      # (checked 2026-10-14, 7.37.5 peers ^9.7). Lift once it supports 10.
      - dependency-name: eslint
        versions: [">=10"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
