# Continuous integration.
#
# Everything here runs offline. No GCP credentials, no database, no bucket: the
# test suite injects fakes for all three, and two autouse guards in
# `tests/conftest.py` fail any test that tries to open a real Cloud Storage or
# Cloud SQL connection. That is deliberate -- a CI job holding production
# credentials is a credential that leaks from a pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so no code path can fall back to a real service if a default changes.
  DATABASE_URL: "sqlite://"
  AUTH_DISABLED: ""
  ENV: "ci"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest tests/ -q

      # Split out so a cross-tenant failure is legible in the job list rather
      # than buried in the full run. A leak here is a disclosure, not a bug.
      - name: Tenant isolation
        run: |
          uv run pytest tests/test_tenant_isolation_api.py \
                        tests/test_auth.py \
                        tests/test_db_repositories.py -q

      # Runs against the frozen corpus in tests/fixtures/eval, not the
      # gitignored agent_output directory -- a fresh checkout has no such
      # directory, and the gate must measure a fixed corpus for its baseline to
      # mean anything.
      - name: Evaluation gate
        run: |
          uv run python eval/eval.py \
            --ground-truth invoice_processing/exemplary_data \
            --agent-output tests/fixtures/eval/agent_output \
            --skip-llm \
            --require-baseline

      # The acceptance sweep: exercises the wiring, which unit tests cannot.
      # Offline tier only -- the live tier needs Cloud SQL and GCS.
      - name: Phase 1 acceptance sweep
        run: uv run python scripts/verify_phase1.py

      - name: Secret scan
        run: |
          # A committed .env or service-account key is the one mistake that
          # cannot be undone by a revert -- the credential is already public.
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it and rotate the secrets."
            exit 1
          fi
          if git ls-files | grep -E '\.json$' | xargs -r grep -l '"private_key"' ; then
            echo "::error::A service-account key appears to be committed."
            exit 1
          fi
          echo "No committed credentials found."

  # The same DB-backed tests, against the database production actually runs.
  #
  # SQLite is what the suite uses everywhere else, and three shipped bugs prove
  # what that hides: `numeric >= character varying` is a hard error on Postgres
  # and a silent cast on SQLite, a thousands separator parses on one and not
  # the other, and a query per row is free on a file and a round trip on a
  # database. This job is the second dialect, not a second suite -- the tests
  # are the same files, pointed at Postgres by TEST_DATABASE_URL.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoices_test
        ports:
          - 5432:5432
        # Without the health check the first connection races the server's
        # start-up and the job fails for a reason that has nothing to do with
        # the code.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # pg8000 because that is the driver the Cloud SQL connector uses in
      # production; testing through a different driver would test a different
      # set of type conversions.
      PG_URL: "postgresql+pg8000://postgres:postgres@localhost:5432/invoices_test"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      # First, and ending back at an empty database: the expression indexes are
      # Postgres-only DDL that no other job can execute, so until now nothing
      # checked that they parse. Downgrading leaves the schema for the tests to
      # create themselves.
      - name: Migrations round-trip
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: DB-backed tests against Postgres
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          uv run pytest tests/test_sheet_api.py \
                        tests/test_exports.py \
                        tests/test_db_repositories.py \
                        tests/test_tenant_isolation_api.py -q

  # A separate toolchain, so a separate job: a broken npm install must not
  # hide a green Python suite, or the other way round.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # The browser half. Separate from `frontend` because it downloads a browser
  # and boots the real API, and a slow job should not sit in front of a fast
  # lint. Extraction stays out: it needs Vertex and has been seen hanging for
  # 15-25 minutes, which is not a thing CI may depend on.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --frozen || uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # No separate build step: `npm run test:e2e` has a pretest that builds
      # with the API origin the Playwright config starts the API on. Building
      # here as well would only create a way for the two to disagree.
      - name: End-to-end smoke
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # The gate. Railway deploys on push by default, which means a red build
  # ships: `df75483` reached production while its Postgres job was failing.
  # Nothing bad came of that one, but the deploy neither knew nor cared.
  #
  # So the deploy becomes a step in this workflow instead, behind `needs:` --
  # a job cannot start until every check it names has passed, which is the
  # gate expressed as a dependency rather than as a setting somebody has to
  # remember. Only on a push to main: a pull request must never deploy.
  #
  # This is only a gate if Railway's own auto-deploy is off. With both on,
  # every push deploys twice and the automatic one is still ungated. Turn
  # "Wait for CI" on, or disconnect the repo from each service, before
  # trusting this.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, postgres, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One at a time, and never cancelled halfway: a deploy interrupted between
    # two of the three services would leave the API and the worker on
    # different commits, which is exactly the state migrations must not meet.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Railway CLI
        run: npm install -g @railway/cli@4

      # Inert until the token exists, rather than red. A deploy job that fails
      # for want of a secret teaches everyone to ignore a red main, which
      # costs more than the ungated deploy it was added to prevent.
      - name: Is a deploy token configured?
        id: token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No RAILWAY_TOKEN secret: nothing deployed. Add one under Settings > Secrets and variables > Actions to turn this job on."
          fi

      # api first, worker second, app last. The API runs the migrations at
      # startup, so the schema is in place before the worker writes through it
      # and before the frontend asks for anything new.
      #
      # `--ci` waits for the build and fails the step when it fails, rather
      # than reporting success for a deploy that has only been queued.
      - name: Deploy api
        if: steps.token.outputs.ready == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service api

      - name: Deploy worker
        if: steps.token.outputs.ready == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service worker

      - name: Deploy app
        if: steps.token.outputs.ready == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service app
