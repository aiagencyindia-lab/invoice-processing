# Continuous integration.
#
# Everything here runs offline. No GCP credentials, no database, no bucket: the
# test suite injects fakes for all three, and two autouse guards in
# `tests/conftest.py` fail any test that tries to open a real Cloud Storage or
# Cloud SQL connection. That is deliberate -- a CI job holding production
# credentials is a credential that leaks from a pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so no code path can fall back to a real service if a default changes.
  DATABASE_URL: "sqlite://"
  AUTH_DISABLED: ""
  ENV: "ci"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest tests/ -q

      # Split out so a cross-tenant failure is legible in the job list rather
      # than buried in the full run. A leak here is a disclosure, not a bug.
      - name: Tenant isolation
        run: |
          uv run pytest tests/test_tenant_isolation_api.py \
                        tests/test_auth.py \
                        tests/test_db_repositories.py -q

      # Runs against the frozen corpus in tests/fixtures/eval, not the
      # gitignored agent_output directory -- a fresh checkout has no such
      # directory, and the gate must measure a fixed corpus for its baseline to
      # mean anything.
      - name: Evaluation gate
        run: |
          uv run python eval/eval.py \
            --ground-truth invoice_processing/exemplary_data \
            --agent-output tests/fixtures/eval/agent_output \
            --skip-llm \
            --require-baseline

      # The acceptance sweep: exercises the wiring, which unit tests cannot.
      # Offline tier only -- the live tier needs Cloud SQL and GCS.
      - name: Phase 1 acceptance sweep
        run: uv run python scripts/verify_phase1.py

      - name: Secret scan
        run: |
          # A committed .env or service-account key is the one mistake that
          # cannot be undone by a revert -- the credential is already public.
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it and rotate the secrets."
            exit 1
          fi
          if git ls-files | grep -E '\.json$' | xargs -r grep -l '"private_key"' ; then
            echo "::error::A service-account key appears to be committed."
            exit 1
          fi
          echo "No committed credentials found."

  # The same DB-backed tests, against the database production actually runs.
  #
  # SQLite is what the suite uses everywhere else, and three shipped bugs prove
  # what that hides: `numeric >= character varying` is a hard error on Postgres
  # and a silent cast on SQLite, a thousands separator parses on one and not
  # the other, and a query per row is free on a file and a round trip on a
  # database. This job is the second dialect, not a second suite -- the tests
  # are the same files, pointed at Postgres by TEST_DATABASE_URL.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoices_test
        ports:
          - 5432:5432
        # Without the health check the first connection races the server's
        # start-up and the job fails for a reason that has nothing to do with
        # the code.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # pg8000 because that is the driver the Cloud SQL connector uses in
      # production; testing through a different driver would test a different
      # set of type conversions.
      PG_URL: "postgresql+pg8000://postgres:postgres@localhost:5432/invoices_test"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      # First, and ending back at an empty database: the expression indexes are
      # Postgres-only DDL that no other job can execute, so until now nothing
      # checked that they parse. Downgrading leaves the schema for the tests to
      # create themselves.
      - name: Migrations round-trip
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: DB-backed tests against Postgres
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          uv run pytest tests/test_sheet_api.py \
                        tests/test_exports.py \
                        tests/test_db_repositories.py \
                        tests/test_vendor_repository.py \
                        tests/test_approval_repository.py \
                        tests/test_gl_rule_repository.py \
                        tests/test_purchase_order_repository.py \
                        tests/test_worker.py \
                        tests/test_vendor_routes.py \
                        tests/test_approval_routes.py \
                        tests/test_gl_routes.py \
                        tests/test_po_routes.py \
                        tests/test_tenant_isolation_api.py \
                        "tests/test_gcs_and_migrations.py::TestMigration::test_new_tenant_tables_have_forced_isolation_policies_after_upgrade" -q

  # A separate toolchain, so a separate job: a broken npm install must not
  # hide a green Python suite, or the other way round.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # The browser half. Separate from `frontend` because it downloads a browser
  # and boots the real API, and a slow job should not sit in front of a fast
  # lint. Extraction stays out: it needs Vertex and has been seen hanging for
  # 15-25 minutes, which is not a thing CI may depend on.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --frozen || uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # No separate build step: `npm run test:e2e` has a pretest that builds
      # with the API origin the Playwright config starts the API on. Building
      # here as well would only create a way for the two to disagree.
      - name: End-to-end smoke
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
